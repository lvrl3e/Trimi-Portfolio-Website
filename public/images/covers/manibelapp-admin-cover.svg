<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c" />
      <stop offset="100%" stop-color="#0d1730" />
    </linearGradient>
    <radialGradient id="glowBlue2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0038A8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0038A8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGold2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD116" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FCD116" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg2)" />
  <circle cx="180" cy="80" r="260" fill="url(#glowBlue2)" />
  <circle cx="1060" cy="680" r="240" fill="url(#glowGold2)" />

  <!-- city grid streets (decorative, may bleed) -->
  <g opacity="0.14" stroke="#8fa2c0" stroke-width="2">
