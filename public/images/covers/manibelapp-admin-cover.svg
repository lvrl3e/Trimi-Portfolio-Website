  <text x="150" y="380" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#F5F5F5">ManibelApp <tspan fill="#FCD116">Admin</tspan></text>
  <text x="152" y="418" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" letter-spacing="2" fill="#8fa2c0">TRANSPORTATION MANAGEMENT DASHBOARD</text>
