  </g>

  <text x="140" y="235" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="800" fill="#F5F5F5">P&amp;<tspan fill="url(#pGrad)">Loom</tspan></text>
  <text x="142" y="272" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" letter-spacing="3" fill="#9a94c4">TRADE · TRACK · GROW</text>
