<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1a" />
      <stop offset="100%" stop-color="#120e26" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="glowViolet4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg4)" />
  <circle cx="1000" cy="80" r="260" fill="url(#glowViolet4)" />
  <circle cx="160" cy="680" r="240" fill="url(#glowPink4)" />

  <g opacity="0.07" stroke="#a3a3c2">
    <line x1="0" y1="260" x2="1200" y2="260" stroke-width="1" />
    <line x1="0" y1="480" x2="1200" y2="480" stroke-width="1" />
  </g>

  <!-- candlestick chart with trend, centered in safe band -->
  <g transform="translate(140,470)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#2a2450" stroke-width="2" />
    <g stroke-linecap="round">
      <line x1="40" y1="-8" x2="40" y2="-55" stroke="#ec4899" stroke-width="3" />
      <rect x="26" y="-44" width="28" height="28" rx="3" fill="#ec4899" />

      <line x1="110" y1="-30" x2="110" y2="-105" stroke="#22C55E" stroke-width="3" />
      <rect x="96" y="-90" width="28" height="45" rx="3" fill="#22C55E" />

      <line x1="180" y1="-22" x2="180" y2="-82" stroke="#8b5cf6" stroke-width="3" />
      <rect x="166" y="-70" width="28" height="38" rx="3" fill="#8b5cf6" />

      <line x1="250" y1="-65" x2="250" y2="-155" stroke="#22C55E" stroke-width="3" />
      <rect x="236" y="-140" width="28" height="58" rx="3" fill="#22C55E" />

      <line x1="320" y1="-50" x2="320" y2="-130" stroke="#22C55E" stroke-width="3" />
      <rect x="306" y="-115" width="28" height="50" rx="3" fill="#22C55E" />

      <line x1="390" y1="-15" x2="390" y2="-72" stroke="#ec4899" stroke-width="3" />
      <rect x="376" y="-60" width="28" height="32" rx="3" fill="#ec4899" />

      <line x1="460" y1="-80" x2="460" y2="-185" stroke="#22C55E" stroke-width="3" />
      <rect x="446" y="-168" width="28" height="75" rx="3" fill="#22C55E" />

      <line x1="530" y1="-100" x2="530" y2="-205" stroke="#22C55E" stroke-width="3" />
      <rect x="516" y="-188" width="28" height="78" rx="3" fill="#22C55E" />
    </g>
    <path d="M40 -44 C 150 -80, 280 -130, 400 -100 S 560 -215, 660 -245" stroke="url(#pGrad)" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M660 -245 L 640 -228 M660 -245 L 622 -240" stroke="url(#pGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- P&Loom monogram, within safe band -->
  <g transform="translate(1000,375)">
    <path d="M0 -100 C 36 -100, 56 -78, 56 -55 C 56 -32, 36 -10, 0 -10 L 0 -100Z" fill="url(#pGrad)" />
